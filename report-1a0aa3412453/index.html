<title>EF Store Promoter Report</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
  :root{--ground:#f6f5ef;--surface:#fff;--surface-2:#f0efe6;--ink:#17251b;--ink-soft:#5c6d61;
    --line:#dfded1;--brand:#223a28;--accent:#c99700;--ok:#2e8c50;--warn:#c2760c;--bad:#b03a34;
    --idle:#8d9a90;--shadow:0 1px 2px rgba(23,37,27,.05),0 8px 24px -16px rgba(23,37,27,.28);
    color-scheme:light dark;}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --ground:#0e1611;--surface:#16211a;--surface-2:#1d2a21;--ink:#e9efe9;--ink-soft:#9db0a3;
    --line:#2a3a2f;--brand:#cfe3d4;--accent:#ffdd57;--ok:#4cb573;--warn:#e3a13a;--bad:#e0685f;
    --idle:#7f8d84;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -18px rgba(0,0,0,.8);}}
  :root[data-theme="dark"]{--ground:#0e1611;--surface:#16211a;--surface-2:#1d2a21;--ink:#e9efe9;
    --ink-soft:#9db0a3;--line:#2a3a2f;--brand:#cfe3d4;--accent:#ffdd57;--ok:#4cb573;
    --warn:#e3a13a;--bad:#e0685f;--idle:#7f8d84;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -18px rgba(0,0,0,.8);}
  body{background:var(--ground);color:var(--ink);font-family:Montserrat,"Segoe UI",system-ui,sans-serif;
       font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:900px;margin:0 auto;padding-inline:18px;padding-block:0 56px;}
  .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ground);
       border-bottom:1px solid var(--line);margin-inline:-18px;padding:14px 18px 11px;}
  .brandline{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
  .mark{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:20px;}
  .mark em{font-style:normal;color:var(--accent);}
  .spacer{margin-left:auto;}
  select,.btn{font:inherit;font-size:13px;font-weight:600;padding:7px 11px;border-radius:9px;
       border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:38px;
       cursor:pointer;}
  .btn{display:inline-flex;align-items:center;gap:6px;transition:transform .12s;}
  .btn:hover{transform:translateY(-1px);}
  .btn svg{transition:transform .6s cubic-bezier(.22,1,.36,1);}
  .btn.spin svg{transform:rotate(360deg);}
  .stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin-top:13px;}
  @media (max-width:860px){.stats{grid-template-columns:repeat(3,minmax(0,1fr));}}
  @media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr));}}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;}
  .stat b{display:block;font-family:Fraunces,Georgia,serif;font-size:23px;font-weight:700;
          font-variant-numeric:tabular-nums;line-height:1.1;}
  .stat span{font-size:10.5px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;}
  .stat.bad b{color:var(--bad);}
  .chips{display:flex;gap:7px;overflow-x:auto;margin:12px -18px 0;padding:2px 18px 4px;
         scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
        border-radius:999px;padding:7px 13px;font:inherit;font-size:12.5px;font-weight:600;
        cursor:pointer;min-height:36px;transition:background .18s,color .18s,transform .12s;}
  .chip:hover{transform:translateY(-1px);}
  .chip[aria-pressed="true"]{background:var(--brand);color:var(--ground);border-color:var(--brand);}
  .chip em{font-style:normal;opacity:.6;font-variant-numeric:tabular-nums;}
  .warnbar{display:flex;gap:10px;background:color-mix(in srgb,var(--warn) 12%,transparent);
           border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:12px;
           padding:11px 14px;margin-top:14px;font-size:12.5px;}
  .warnbar b{color:var(--warn);flex:0 0 auto;}
  .state-h{display:flex;align-items:baseline;gap:9px;margin:22px 0 9px;}
  .state-h h2{font-family:Fraunces,Georgia,serif;font-size:17px;font-weight:700;margin:0;}
  .state-h span{font-size:11.5px;color:var(--ink-soft);font-weight:600;white-space:nowrap;}
  .state-h i{flex:1;height:1px;background:var(--line);}
  .list{display:grid;gap:10px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
        box-shadow:var(--shadow);overflow:hidden;position:relative;
        animation:rise .4s cubic-bezier(.22,1,.36,1) backwards;animation-delay:calc(var(--i)*35ms);}
  .card::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--stripe,var(--idle));}
  @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .head{display:flex;gap:12px;align-items:flex-start;padding:13px 15px 11px 17px;cursor:pointer;
        width:100%;background:none;border:0;font:inherit;color:inherit;text-align:left;}
  .who{flex:1;min-width:0;}
  .who b{display:block;font-size:14.5px;font-weight:700;}
  .who span{display:block;font-size:12px;color:var(--ink-soft);margin-top:1px;
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .nums{display:flex;gap:13px;flex:0 0 auto;text-align:right;}
  .num b{display:block;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;}
  .num span{font-size:10px;color:var(--ink-soft);text-transform:uppercase;}
  .chev{flex:0 0 auto;color:var(--ink-soft);transition:transform .25s;margin-top:4px;}
  .card.open .chev{transform:rotate(90deg);}
  .timeline{padding:0 15px 11px 17px;}
  .tl{position:relative;height:22px;border-radius:5px;background:var(--surface-2);overflow:hidden;}
  .tl i{position:absolute;top:4px;width:6px;height:14px;border-radius:2px;background:var(--ok);}
  .tl i.sale{background:var(--accent);height:20px;top:1px;width:7px;}
  .tlkey{display:flex;gap:14px;font-size:10.5px;color:var(--ink-soft);margin-top:5px;}
  .dot{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:4px;vertical-align:middle;}
  .body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s cubic-bezier(.22,1,.36,1);}
  .card.open .body{grid-template-rows:1fr;}
  .body>div{overflow:hidden;}
  .inner{padding:12px 15px 15px 17px;border-top:1px solid var(--line);}
  .lbl{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
       color:var(--ink-soft);margin:10px 0 6px;}
  .lbl:first-child{margin-top:0;}
  .sale{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);}
  .sale:first-of-type{border-top:0;}
  .stime{font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:600;flex:0 0 42px;}
  .sbody{flex:1;min-width:0;}
  .parsed{font-size:13px;font-weight:600;}
  .said{font-size:12.5px;color:var(--ink-soft);font-style:italic;word-break:break-word;}
  .badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;
         margin-left:7px;vertical-align:middle;text-transform:uppercase;letter-spacing:.02em;
         background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);}
  .badge.rep{background:color-mix(in srgb,var(--idle) 18%,transparent);color:var(--ink-soft);}
  .verdict{flex:0 0 auto;font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;
           text-transform:uppercase;white-space:nowrap;}
  .v-pending{background:color-mix(in srgb,var(--idle) 18%,transparent);color:var(--ink-soft);}
  .v-match{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);}
  .v-corrected{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);}
  .v-mismatch,.v-no_receipt,.v-unreadable{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);}
  .fix{font-size:11.5px;color:var(--warn);margin-top:3px;font-weight:600;}
  .needcheck{font-size:11.5px;color:var(--bad);margin-top:3px;font-weight:600;}
  .badge.check{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);}
  .band{display:block;font-size:11.5px;font-weight:700;margin-top:3px;}
  .band small{font-weight:600;opacity:.85;}
  .band.bad{color:var(--bad);}
  .band.ok{color:var(--ok);}
  .band.great{color:var(--accent);}
  .band.none{color:var(--ink-soft);}
  .badge.wrote{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);}
  .flag{font-size:11.5px;color:var(--bad);margin-top:3px;}
  .chipsmall{display:flex;flex-wrap:wrap;gap:5px;}
  .tag{font-size:11px;padding:3px 8px;border-radius:6px;background:var(--surface-2);
       color:var(--ink-soft);font-weight:600;font-variant-numeric:tabular-nums;}
  .muted{font-size:12.5px;color:var(--ink-soft);}
  .empty{text-align:center;padding:40px 20px;color:var(--ink-soft);border:1px dashed var(--line);
         border-radius:14px;margin-top:16px;}
  .note{font-size:11.5px;color:var(--ink-soft);margin-top:22px;text-align:center;line-height:1.6;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;}}
</style>
<div class="wrap">
  <header class="top">
    <div class="brandline"><div class="mark">EF Store <em>Promoter Report</em></div>
      <span class="spacer"></span>
      <select id="day" aria-label="Day"></select>
      <button class="btn" id="refresh" type="button" title="Fetch the latest data">
        <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path
          d="M13.6 8a5.6 5.6 0 1 1-1.7-4M13.5 1.5V5H10" fill="none" stroke="currentColor"
          stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Refresh</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="chips" id="areas"></div>
  </header>
  <main id="list"></main>
  <p class="note">Customer names and phone numbers are removed from this report.<br>
     <span id="stamp">Loading&hellip;</span></p>
</div>
<script>
(function(){
  "use strict";
  var days = [], cur = "", area = "all", open = {}, generated = "", loading = false;
  var elList = document.getElementById("list"), elStats = document.getElementById("stats"),
      elDay = document.getElementById("day"), elAreas = document.getElementById("areas"),
      elStamp = document.getElementById("stamp"), elRefresh = document.getElementById("refresh");

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
  function todayISO(){
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") +
           "-" + String(d.getDate()).padStart(2, "0");
  }
  function mins(t){ var p = String(t || "").split(":"); return (+p[0] || 0) * 60 + (+p[1] || 0); }
  function fmtDay(iso){
    var d = new Date(iso + "T00:00:00");
    return isNaN(d) ? iso : d.toLocaleDateString(undefined,
      {weekday:"short", day:"numeric", month:"short"});
  }

  function timeline(p){
    var S = 8 * 60, E = 23 * 60;
    function pos(t){ return Math.max(0, Math.min(100, (mins(t) - S) / (E - S) * 100)); }
    var marks = p.checks.map(function(t){
        return '<i style="left:' + pos(t).toFixed(1) + '%" title="' + esc(t) + '"></i>'; })
      .concat(p.sales.map(function(s){
        return '<i class="sale" style="left:' + pos(s.at).toFixed(1) + '%" title="' + esc(s.at) + '"></i>'; }))
      .join("");
    return '<div class="timeline"><div class="tl">' + marks + '</div><div class="tlkey">' +
      '<span><i class="dot" style="background:var(--ok)"></i>' + p.check_count + ' hourly checks</span>' +
      '<span><i class="dot" style="background:var(--accent)"></i>' + p.sales.length + ' sales</span>' +
      '<span>8am &rarr; 11pm</span></div></div>';
  }

  function card(p, i){
    var isOpen = !!open[p.name];
    var lvl = (p.band || {}).level;
    var stripe = lvl === "great" ? "var(--accent)" : lvl === "ok" ? "var(--ok)"
               : lvl === "bad" ? "var(--bad)" : "var(--idle)";
    var badge = "";
    if (p.wrote_wrong) badge += '<span class="badge wrote">wrote ' + p.wrote_wrong + ' wrong</span>';
    if (p.needs_check) badge += '<span class="badge check">' + p.needs_check + ' to verify</span>';

    // The verdict is words, not just a colour - a supervisor should not have to decode a stripe.
    // While the day is still running it says "so far", so nobody is chased at 10am for a figure
    // that has all afternoon to change.
    var b = p.band || {};
    var sofar = (cur === todayISO() && b.level && b.level !== "none") ? " so far" : "";
    var bandLine = b.label
      ? '<span class="band ' + esc(b.level || "") + '">' + esc(b.label) + sofar +
        ' · ' + (p.effective_units != null ? p.effective_units : p.units) + ' units' +
        (b.note ? ' <small>— ' + esc(b.note) + '</small>' : '') + '</span>'
      : "";
    var sales = p.sales.map(function(s){
      var parsed = (s.claimed || []).map(function(c){ return c.qty + " × " + c.product; })
                   .join(", ") || "nothing countable";
      var fixed = "";
      if (s.needs_physical_check){
        // Say what is wrong AND what to do about it - "no receipt" and "wrong photo" need
        // different conversations with the promoter.
        var what, todo;
        if (s.verdict === "unreadable"){
          what = "The uploaded photo is not a readable receipt";
          todo = "Ask the promoter to re-upload a clear photo of the receipt.";
        } else {
          what = "No receipt uploaded";
          todo = "Check the outlet's receipt book or till records for this sale.";
        }
        fixed += '<div class="needcheck">&#9888; ' + what +
                 ' — counted as a sale, but needs physical verification.<br>' +
                 '<span style="font-weight:500">' + todo +
                 (s.note ? ' · ' + esc(s.note) : '') + '</span></div>';
      }
      if (s.wrote_wrong && (s.receipt_says || []).length){
        var real = s.receipt_says.map(function(c){ return c.qty + " × " + c.product; }).join(", ");
        fixed = '<div class="fix">&#9888; Receipt says <b>' + esc(real) +
                '</b> — counted from the receipt; the promoter wrote it up wrongly.</div>';
      }
      return '<div class="sale"><span class="stime">' + esc(s.at) + '</span><span class="sbody">' +
        '<span class="parsed">' + esc(parsed) + '</span>' +
        '<span class="said">&ldquo;' + esc(s.said) + '&rdquo;</span>' + fixed +
        (s.flags || []).map(function(f){ return '<div class="flag">&#9873; ' + esc(f) + '</div>'; }).join("") +
        '</span><span class="verdict v-' + esc(s.verdict) + '">' +
        esc(String(s.verdict).replace("_", " ")) + '</span></div>';
    }).join("") || '<div class="muted">No sales logged.</div>';

    var checks = p.checks.length
      ? '<div class="chipsmall">' + p.checks.map(function(t){
          return '<span class="tag">' + esc(t) + '</span>'; }).join("") + '</div>'
      : '<div class="muted">No hourly checks logged.</div>';

    return '<article class="card' + (isOpen ? " open" : "") +
      '" style="--stripe:' + stripe + ';--i:' + i + '">' +
      '<button class="head" type="button" data-t="' + esc(p.name) + '" aria-expanded="' + isOpen + '">' +
      '<span class="who"><b>' + esc(p.name) + badge + '</b><span>' + esc(p.site || "—") +
      ' · ' + esc(p.first) + '–' + esc(p.last) + '</span>' + bandLine + '</span>' +
      '<span class="nums">' +
      '<span class="num"><b>' + p.check_count + '</b><span>checks</span></span>' +
      '<span class="num"><b>' + p.units + '</b><span>units</span></span>' +
      '<span class="num"><b>RM' + Number(p.commission).toFixed(2) + '</b><span>claimed</span></span>' +
      '</span><svg class="chev" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">' +
      '<path d="M5 3l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" ' +
      'stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +
      timeline(p) +
      '<div class="body"><div><div class="inner"><div class="lbl">Sales</div>' + sales +
      '<div class="lbl">Hourly checks</div>' + checks + '</div></div></div></article>';
  }

  function render(){
    var d = null;
    for (var k = 0; k < days.length; k++) if (days[k].date === cur) d = days[k];

    elDay.innerHTML = days.map(function(x){
      return '<option value="' + x.date + '"' + (x.date === cur ? ' selected' : '') + '>' +
             fmtDay(x.date) + '</option>'; }).join("");

    if (!d){ elList.innerHTML = '<div class="empty">No data for this day.</div>'; return; }

    var t = d.totals || {};
    elStats.innerHTML = [
      ['<b>' + (t.people || 0) + '</b><span>worked</span>', ''],
      ['<b>' + (t.hourly_checks || 0) + '</b><span>hourly checks</span>', ''],
      ['<b>' + (t.claimed_units || 0) + '</b><span>units</span>', ''],
      ['<b>' + (t.below_target || 0) + '</b><span>below target</span>',
       (t.below_target ? 'bad' : '')],
      ['<b>' + (t.needs_check || 0) + '</b><span>to verify</span>',
       (t.needs_check ? 'bad' : '')]
    ].map(function(s){ return '<div class="stat ' + s[1] + '">' + s[0] + '</div>'; }).join("");

    // group by Malaysian state, built from whoever actually worked that day
    var byArea = {};
    d.people.forEach(function(p){
      var a = p.area || "Unassigned";
      (byArea[a] = byArea[a] || []).push(p);
    });
    var names = Object.keys(byArea).sort();

    elAreas.innerHTML = ['<button class="chip" type="button" data-a="all" aria-pressed="' +
        (area === "all") + '">All <em>' + d.people.length + '</em></button>']
      .concat(names.map(function(a){
        return '<button class="chip" type="button" data-a="' + esc(a) + '" aria-pressed="' +
               (area === a) + '">' + esc(a) + ' <em>' + byArea[a].length + '</em></button>';
      })).join("");

    var show = names.filter(function(a){ return area === "all" || a === area; });
    var warn = d.partial
      ? '<div class="warnbar"><b>Partial day</b><span>' + esc(d.partial_note) + '</span></div>' : '';

    if (!show.length){
      elList.innerHTML = warn + '<div class="empty">Nobody worked in that state today.</div>';
      return;
    }

    var i = 0;
    elList.innerHTML = warn + show.map(function(a){
      var ppl = byArea[a].slice().sort(function(x, y){ return (y.units || 0) - (x.units || 0); });
      var units = ppl.reduce(function(sum, p){ return sum + (p.units || 0); }, 0);
      var short = ppl.filter(function(p){ return p.below_target; }).length;
      return '<div class="state-h"><h2>' + esc(a) + '</h2><span>' + ppl.length +
             (ppl.length === 1 ? ' promoter' : ' promoters') + ' · ' + units + ' units' +
             (short ? ' · ' + short + ' below target' : '') + '</span>' +
             '<i></i></div><div class="list">' +
             ppl.map(function(p){ return card(p, i++); }).join("") + '</div>';
    }).join("");
  }

  function load(manual){
    if (loading) return;
    loading = true;
    if (manual) elRefresh.classList.add("spin");
    fetch("data.json?t=" + Date.now(), {cache: "no-store"})
      .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(payload){
        days = payload.days || [];
        generated = payload.generated || "";
        var found = false;
        for (var k = 0; k < days.length; k++) if (days[k].date === cur) found = true;
        if (!found) cur = days.length ? days[0].date : "";
        render();
        elStamp.textContent = generated ? ("Data from " + generated) : "";
      })
      .catch(function(){
        if (!days.length) elList.innerHTML =
          '<div class="empty">Could not load the report. Try Refresh.</div>';
        elStamp.textContent = "Could not refresh — showing the last data loaded.";
      })
      .then(function(){
        loading = false;
        setTimeout(function(){ elRefresh.classList.remove("spin"); }, 700);
      });
  }

  document.addEventListener("click", function(e){
    var h = e.target.closest("[data-t]");
    if (h){
      var k = h.getAttribute("data-t");
      open[k] = !open[k];
      h.closest(".card").classList.toggle("open", open[k]);
      h.setAttribute("aria-expanded", String(!!open[k]));
      return;
    }
    var a = e.target.closest("[data-a]");
    if (a){ area = a.getAttribute("data-a"); render(); }
  });
  elDay.addEventListener("change", function(){ cur = elDay.value; open = {}; render(); });
  elRefresh.addEventListener("click", function(){ load(true); });
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) load(false); });
  setInterval(function(){ load(false); }, 60000);
  load(false);
})();
</script>
