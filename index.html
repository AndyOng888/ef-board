<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EF Store Task Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
  :root{
    --ground:#f6f5ef; --surface:#fff; --surface-2:#f0efe6;
    --ink:#17251b; --ink-soft:#5c6d61; --line:#dfded1;
    --brand:#223a28; --accent:#c99700;
    --done:#2e8c50; --active:#c2760c; --waiting:#2a6ba8; --idle:#8d9a90;
    --shadow:0 1px 2px rgba(23,37,27,.05), 0 8px 24px -16px rgba(23,37,27,.28);
    color-scheme:light dark;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#0e1611; --surface:#16211a; --surface-2:#1d2a21;
      --ink:#e9efe9; --ink-soft:#9db0a3; --line:#2a3a2f;
      --brand:#cfe3d4; --accent:#ffdd57;
      --done:#4cb573; --active:#e3a13a; --waiting:#5f9ad6; --idle:#7f8d84;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -18px rgba(0,0,0,.8);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--ground); color:var(--ink);
    font-family:Montserrat,"Segoe UI",system-ui,sans-serif; font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  img{max-width:100%;}
  .wrap{max-width:860px;margin:0 auto;padding-inline:18px;padding-block:0 56px;}

  .top{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
    background:var(--ground); border-bottom:1px solid var(--line);
    margin-inline:-18px; padding:14px 18px 12px;
  }
  .brandline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .mark{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:20px;letter-spacing:-.01em;}
  .mark em{font-style:normal;color:var(--accent);}
  .live{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-size:11px;
        letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;}
  .live i{width:7px;height:7px;border-radius:50%;background:var(--idle);display:block;}
  .live.on i{background:var(--done);animation:beat 2.4s ease-in-out infinite;}
  @keyframes beat{0%,100%{box-shadow:0 0 0 0 rgba(46,140,80,.5);}50%{box-shadow:0 0 0 6px rgba(46,140,80,0);}}

  .summary{display:flex;align-items:center;gap:18px;margin-top:14px;}
  .ring{flex:0 0 auto;position:relative;width:84px;height:84px;}
  .ring svg{transform:rotate(-90deg);display:block;}
  .ring .track{stroke:var(--line);}
  .ring .fill{stroke:var(--done);stroke-linecap:round;transition:stroke-dashoffset 1.4s cubic-bezier(.22,1,.36,1);}
  .ring b{position:absolute;inset:0;display:grid;place-content:center;
          font-family:Fraunces,Georgia,serif;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;}
  .ring b span{font-size:11px;font-family:Montserrat,sans-serif;font-weight:600;color:var(--ink-soft);
               display:block;text-align:center;letter-spacing:.06em;}
  .tally{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;flex:1;min-width:0;}
  .tally div{display:flex;align-items:baseline;gap:7px;min-width:0;}
  .tally strong{font-variant-numeric:tabular-nums;font-size:17px;font-weight:700;}
  .tally span{font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .swatch{width:8px;height:8px;border-radius:2px;flex:0 0 auto;}

  .chips{display:flex;gap:8px;overflow-x:auto;margin:14px -18px 0;padding:2px 18px 4px;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
        border-radius:999px;padding:7px 13px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;
        transition:background .18s,color .18s,border-color .18s,transform .12s;}
  .chip:hover{transform:translateY(-1px);}
  .chip[aria-pressed="true"]{background:var(--brand);color:var(--ground);border-color:var(--brand);}
  .chip em{font-style:normal;opacity:.65;font-variant-numeric:tabular-nums;}

  .board{display:grid;gap:12px;margin-top:18px;}
  @media (min-width:720px){.board{grid-template-columns:repeat(2,minmax(0,1fr));}}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
        overflow:hidden;position:relative;transition:transform .18s,box-shadow .2s;}
  .card::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--stripe,var(--idle));}
  .card.is-active::before{background:linear-gradient(180deg,var(--active),rgba(194,118,12,.2));
                          background-size:100% 200%;animation:slide 2.6s linear infinite;}
  @keyframes slide{to{background-position:0 -200%;}}
  .card:hover{transform:translateY(-2px);}
  .intro .card{animation:rise .5s cubic-bezier(.22,1,.36,1) backwards;animation-delay:calc(var(--i)*55ms);}
  @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  .head{display:flex;gap:11px;align-items:flex-start;padding:14px 15px 13px 17px;cursor:pointer;
        width:100%;background:none;border:0;font:inherit;color:inherit;text-align:left;}
  .uid{font-size:10.5px;font-weight:700;letter-spacing:.09em;color:var(--ink-soft);border:1px solid var(--line);
       border-radius:5px;padding:3px 6px;flex:0 0 auto;margin-top:1px;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .title{flex:1;min-width:0;font-weight:600;font-size:14.5px;line-height:1.35;text-wrap:balance;}
  .pill{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;
        font-size:11px;font-weight:700;white-space:nowrap;color:var(--stripe);
        background:color-mix(in srgb,var(--stripe) 14%,transparent);}
  .pill i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block;}
  .is-active .pill i{animation:throb 1.6s ease-in-out infinite;}
  @keyframes throb{50%{opacity:.45;transform:scale(.75);}}
  .chev{flex:0 0 auto;color:var(--ink-soft);transition:transform .25s cubic-bezier(.22,1,.36,1);margin-top:2px;}
  .card.open .chev{transform:rotate(90deg);}

  .meter{height:3px;background:var(--surface-2);margin:0 15px 5px 17px;border-radius:2px;overflow:hidden;}
  .meter i{display:block;height:100%;background:var(--stripe);border-radius:2px;
           transition:width 1.1s cubic-bezier(.22,1,.36,1);}
  .meter-label{font-size:11px;color:var(--ink-soft);padding:0 15px 12px 17px;font-variant-numeric:tabular-nums;}

  .body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s cubic-bezier(.22,1,.36,1);}
  .card.open .body{grid-template-rows:1fr;}
  .body > div{overflow:hidden;}
  .inner{padding:13px 17px 16px;border-top:1px solid var(--line);}
  .lbl{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:5px;}
  .next{font-size:13.5px;line-height:1.55;margin-bottom:13px;}
  .files{font-size:12px;color:var(--ink-soft);font-family:ui-monospace,Consolas,monospace;
         word-break:break-all;margin-bottom:10px;}
  .stamp{font-size:11px;color:var(--ink-soft);}

  .edit{display:inline-flex;align-items:center;gap:8px;margin-top:20px;background:var(--brand);color:var(--ground);
        text-decoration:none;border-radius:10px;padding:12px 16px;font-weight:600;font-size:13.5px;
        transition:transform .14s;min-height:44px;}
  .edit:hover{transform:translateY(-1px);}
  .refresh{background:var(--surface);border:1px solid var(--line);color:var(--ink-soft);border-radius:10px;
           padding:12px 14px;font:inherit;font-weight:600;font-size:13.5px;cursor:pointer;margin-left:8px;min-height:44px;}
  .state{text-align:center;padding:46px 20px;color:var(--ink-soft);border:1px dashed var(--line);
         border-radius:14px;margin-top:18px;}
  .state h2{font-family:Fraunces,Georgia,serif;font-size:19px;color:var(--ink);margin:0 0 7px;}
  .state p{margin:0 0 6px;font-size:13.5px;}
  .state code{background:var(--surface-2);padding:2px 6px;border-radius:4px;font-size:12px;}
  .skel{height:74px;border-radius:14px;border:1px solid var(--line);
        background:linear-gradient(100deg,var(--surface) 30%,var(--surface-2) 50%,var(--surface) 70%);
        background-size:220% 100%;animation:shim 1.5s linear infinite;}
  @keyframes shim{to{background-position:-220% 0;}}
  .note{font-size:12px;color:var(--ink-soft);margin-top:24px;text-align:center;line-height:1.6;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brandline">
      <div class="mark">EF Store <em>Board</em></div>
      <div class="live" id="live"><i></i><span id="livetxt">loading</span></div>
    </div>
    <div class="summary">
      <div class="ring">
        <svg width="84" height="84" viewBox="0 0 84 84" aria-hidden="true">
          <circle class="track" cx="42" cy="42" r="34" fill="none" stroke-width="7"></circle>
          <circle class="fill" id="ring" cx="42" cy="42" r="34" fill="none" stroke-width="7"
                  stroke-dasharray="213.6" stroke-dashoffset="213.6"></circle>
        </svg>
        <b id="pct">0%<span>DONE</span></b>
      </div>
      <div class="tally" id="tally"></div>
    </div>
    <div class="chips" id="chips"></div>
  </header>

  <main class="board intro" id="board" aria-live="polite">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </main>

  <p style="margin-top:20px">
    <button class="refresh" type="button" id="refresh">Refresh</button>
  </p>
  <p class="note">Tap a task to see where it stopped.<br>
     To add or change anything, tell Claude and this board updates.<br>
     <span id="stamp"></span></p>
</div>

<script>
(function(){
  "use strict";
  var SOURCE = "tasks.json";   // generated from video-tools/TASKS.md by build.py

  var STATUS = {
    done:{label:"Done",color:"var(--done)"},
    active:{label:"In progress",color:"var(--active)"},
    waiting:{label:"Waiting on you",color:"var(--waiting)"},
    idle:{label:"Not started",color:"var(--idle)"}
  };
  var ORDER = ["active","waiting","idle","done"];
  var RANK = {active:0, waiting:1, idle:2, done:3};
  var tasks = [], filter = "all", open = {}, first = true;

  var board=document.getElementById("board"), chips=document.getElementById("chips"),
      tally=document.getElementById("tally"), ring=document.getElementById("ring"),
      pct=document.getElementById("pct"), live=document.getElementById("live"),
      livetxt=document.getElementById("livetxt");

  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}

  function counts(){
    var c={all:tasks.length,done:0,active:0,waiting:0,idle:0};
    tasks.forEach(function(t){ c[t.status]++; });
    return c;
  }

  function paintSummary(){
    var c = counts(), total = tasks.length || 1, ratio = c.done/total, C = 213.6;
    ring.style.strokeDashoffset = String(C - C*ratio);
    var target = Math.round(ratio*100), start = parseInt(pct.dataset.v||"0",10), t0 = performance.now();
    (function step(now){
      var k = Math.min(1,(now-t0)/700), v = Math.round(start+(target-start)*(1-Math.pow(1-k,3)));
      pct.innerHTML = v + "%<span>DONE</span>";
      if(k < 1) requestAnimationFrame(step); else pct.dataset.v = String(target);
    })(t0);
    tally.innerHTML = ORDER.map(function(k){
      return '<div><span class="swatch" style="background:'+STATUS[k].color+'"></span><strong>'+
             c[k]+'</strong><span>'+STATUS[k].label+'</span></div>';}).join("");
    chips.innerHTML = ["all"].concat(ORDER).map(function(k){
      return '<button class="chip" type="button" data-f="'+k+'" aria-pressed="'+(filter===k)+'">'+
             (k==="all"?"All":STATUS[k].label)+' <em>'+c[k]+'</em></button>';}).join("");
  }

  function card(t,i){
    var st = STATUS[t.status], isOpen = !!open[t.key];
    var meter = (t.total > 0) ?
      '<div class="meter"><i style="width:'+Math.round(t.done/t.total*100)+'%"></i></div>'+
      '<div class="meter-label">'+t.done+' of '+t.total+' done</div>' : '';
    return '<article class="card'+(isOpen?" open":"")+(t.status==="active"?" is-active":"")+
      '" style="--stripe:'+st.color+';--i:'+i+'">'+
      '<button class="head" type="button" data-toggle="'+esc(t.key)+'" aria-expanded="'+isOpen+'">'+
        '<span class="uid">'+esc(t.uid || "NEW")+'</span>'+
        '<span class="title">'+esc(t.title)+'</span>'+
        '<span class="pill"><i></i>'+st.label+'</span>'+
        '<svg class="chev" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">'+
        '<path d="M5 3l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" '+
        'stroke-linecap="round" stroke-linejoin="round"/></svg>'+
      '</button>'+ meter +
      '<div class="body"><div><div class="inner">'+
        (t.next ? '<div class="lbl">Where it stopped</div><div class="next">'+esc(t.next)+'</div>' : '')+
        (t.files ? '<div class="lbl">Files</div><div class="files">'+esc(t.files)+'</div>' : '')+
        (t.updated ? '<div class="stamp">Updated '+esc(t.updated)+'</div>' : '')+
      '</div></div></div></article>';
  }

  function render(){
    paintSummary();
    var list = tasks.filter(function(t){ return filter==="all" || t.status===filter; });
    if(!list.length){
      board.innerHTML = '<div class="state"><h2>Nothing here</h2><p>No task has this status right now.</p></div>';
      return;
    }
    board.innerHTML = list.map(card).join("");
    if(first){ first = false; setTimeout(function(){ board.classList.remove("intro"); }, 1400); }
  }

  document.addEventListener("click", function(e){
    var head = e.target.closest("[data-toggle]");
    if(head){
      var k = head.getAttribute("data-toggle");
      open[k] = !open[k];
      head.closest(".card").classList.toggle("open", open[k]);
      head.setAttribute("aria-expanded", String(!!open[k]));
      return;
    }
    var chip = e.target.closest("[data-f]");
    if(chip){ filter = chip.getAttribute("data-f"); render(); }
  });

  document.getElementById("refresh").addEventListener("click", function(){ load(true); });

  function load(manual){
    if(manual){ livetxt.textContent = "refreshing"; }
    fetch(SOURCE + "?_=" + Date.now())
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(data){
        var list = (data && data.tasks) || [];
        if(data && data.generated){
          document.getElementById("stamp").textContent = "Board data: " + data.generated;
        }
        tasks = list.map(function(t, idx){
          return {
            key:"r"+idx,
            uid:t.uid || "",
            title:t.title || "",
            status:STATUS[t.status] ? t.status : "idle",
            next:t.next || "",
            files:t.files || "",
            done:t.done || 0,
            total:t.total || 0,
            updated:t.updated || ""
          };
        }).filter(function(t){ return t.title; })
          .sort(function(a,b){ return RANK[a.status] - RANK[b.status]; });
        live.classList.add("on"); livetxt.textContent = "live";
        render();
      })
      .catch(function(){
        live.classList.remove("on"); livetxt.textContent = "offline";
        if(!tasks.length){
          board.innerHTML = '<div class="state"><h2>Board data not loading</h2>'+
            '<p>The page could not read <code>tasks.json</code>. Try Refresh, '+
            'or tell Claude and it will republish the board.</p></div>';
        }
      });
  }

  load(false);
  setInterval(function(){ load(false); }, 60000);
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) load(false); });
})();
</script>
</body>
</html>
